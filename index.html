<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Help Desk</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>
            Campus Help Desk
        </h1>
        <nav>
           <a href="#Home">Home</a>
           <a href="#help">Help</a>
           <a href="#contact">Contact</a>
        </nav>
    </header>
    <main id="Home">
        <section id="Help">
          <h2>
            Submit your issue
            <p>
                Tell us about the problem you are facing.
            </p>
          </h2>
          <form action="#" id="helpform">
            <label for="email">
                Email Address:
            </label>
             <input type="text" placeholder="Enter your email" required id="email">
             <label for="issue">
                Describe your issue:
             </label>
             <textarea  id="issue" placeholder="Explain your problem......" required></textarea>
             <p id="message"></p>
             <button type="submit">
                Submit
             </button>
          </form>
        </section>

    </main>
    <footer id="Contact">
        <p>
            Campus Help Desk &copy; 2026
        </p>
    </footer>
</body>
</html>
